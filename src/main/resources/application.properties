spring.application.name=restaurant
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080

# Asistente de pedidos con IA (Google Gemini). La clave va en el archivo .env como GEMINI_API_KEY=...
# Sin clave, el asistente funciona solo con el intérprete por reglas.
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.modelo=${GEMINI_MODEL:gemini-3.5-flash-lite}
ia.gemini.url=https://generativelanguage.googleapis.com
ia.gemini.tiempo-maximo-segundos=30
