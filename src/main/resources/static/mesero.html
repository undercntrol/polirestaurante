<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesero · PoliRestaurante</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><header><h1>Mesero</h1><a href="index.html" id="salir">Cerrar sesión</a></header>
<main class="dos">
<section><h2>Mesas</h2><div id="mesas" class="mesas"></div>
<button class="claro" id="llevar" style="width:100%;margin-top:10px">Nuevo pedido para llevar</button>
<h2 style="margin-top:22px">Pedido por texto (IA)</h2>
<textarea id="iaTexto" rows="3" placeholder="Ej.: mesa 3, dos hamburguesas sin cebolla y una gaseosa" aria-label="Pedido en texto"></textarea>
<div class="campos" style="margin-top:8px"><select id="iaMotor" aria-label="Motor"><option value="">Automático</option><option value="GEMINI">Gemini (IA)</option><option value="REGLAS">Reglas (sin IA)</option></select><button id="iaInterpretar">Interpretar</button></div>
<div id="iaPropuesta"></div>
<h2 style="margin-top:22px">Mis pedidos activos</h2><div id="activos"></div>
<h2 style="margin-top:22px">Abrir un pedido</h2>
<div class="campos"><input id="nroPedido" type="number" min="1" placeholder="Número de pedido"><button class="claro" id="abrir">Abrir</button></div></section>
<section id="panel"><p class="vacio">Elige una mesa libre para crear un pedido.</p></section>
</main><div id="aviso" role="status"></div>
<script src="js/api.js"></script>
<script>
exigirSesion('MESERO'); // sin sesión de mesero, vuelve al inicio de sesión
let pedido = null, menu = [], metodos = [], propuesta = null;
let vistos = null; // ids de los pedidos activos en la consulta anterior, para notar los que cancela cocina

async function cargarActivos() {
  const activos = await api('/pedidos/activos');
  if (vistos) vistos.filter(id => !activos.some(p => p.id === id)).forEach(avisarSiCocinaCancelo);
  vistos = activos.map(p => p.id);
  $('#activos').innerHTML = activos.length
    ? activos.map(p => `<button class="claro" data-ver="${p.id}" style="width:100%;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span>${lugar(p)} · n.º ${p.id}</span><span class="chip e-${p.estado}">${p.estado === 'LISTO' ? 'Listo para recoger' : ETIQ[p.estado]}</span></button>`).join('')
    : '<p class="vacio">No tienes pedidos activos.</p>';
}
async function cargarMesas() {
  cargarActivos().catch(err => aviso(err.message, true));
  const mesas = await api('/mesas');
  $('#mesas').innerHTML = mesas.map(m => `<button class="mesa ${m.estado.toLowerCase()}" data-id="${m.id}" ${m.estado === 'OCUPADA' ? 'disabled' : ''}>Mesa ${m.numero}<br><small>${m.estado === 'LIBRE' ? 'libre' : 'ocupada'}</small></button>`).join('');
}
/** Un pedido salió de "activos": si fue porque cocina lo canceló, se avisa con el motivo. */
async function avisarSiCocinaCancelo(id) {
  try {
    const p = await api('/pedidos/' + id);
    if (p.estado === 'CANCELADO' && p.canceladoPor === 'COCINA') {
      aviso(`Cocina canceló el pedido n.º ${p.id} (${lugar(p)})${p.motivoCancelacion ? ': ' + p.motivoCancelacion : ''}`, true, 10000);
      if (pedido && pedido.id === p.id) mostrar(p);
      cargarMesas().catch(() => {});
    }
  } catch (e) {}
}
function mostrar(p) { pedido = p; localStorage.setItem('pedido', p.id); pintar(); }

function pintar() {
  const p = pedido, edita = p.estado === 'PENDIENTE';
  const lineas = p.detalles.length ? p.detalles.map(d => `<div class="linea"><div>${d.cantidad} × ${esc(d.productoNombre)}${d.notas ? `<div class="nota">${esc(d.notas)}</div>` : ''}</div><div>${pesos(d.subtotal)} ${edita ? `<button class="claro" data-quitar="${d.id}">Quitar</button>` : ''}</div></div>`).join('') : '<p class="vacio">Todavía no hay productos. Agrégalos desde el menú.</p>';
  const items = menu.map(m => `<div class="menu-item"><div><strong>${esc(m.nombre)}</strong><div class="nota">${esc(m.categoria)}</div></div><div>${pesos(m.precio)}</div><div class="campos"><input type="number" min="1" value="1" aria-label="Cantidad"><input type="text" placeholder="Notas (ej. sin cebolla)" aria-label="Notas"><button data-agregar="${m.id}">Agregar</button></div></div>`).join('');
  $('#panel').innerHTML = `<h2>${lugar(p)} <span class="chip e-${p.estado}">${ETIQ[p.estado]}</span> <span class="nota">pedido n.º ${p.id}</span></h2>${lineas}<div class="total">Total ${pesos(p.total)}</div>`
    + (p.estado === 'CANCELADO' ? `<p class="nota" style="color:var(--cancelado)">Cancelado por ${p.canceladoPor === 'COCINA' ? 'cocina' : 'el mesero'}${p.motivoCancelacion ? ': ' + esc(p.motivoCancelacion) : ''}</p>` : '')
    + (p.estado === 'LISTO' ? '<button id="entregar" style="width:100%;margin-top:12px">Marcar como entregado</button>' : '')
    + (p.estado === 'PENDIENTE' || p.estado === 'EN_PREPARACION' ? '<button id="cancelar" class="claro" style="width:100%;margin-top:12px">Cancelar pedido</button>' : '')
    + (p.estado === 'ENTREGADO' ? (p.estadoPago === 'PAGADO'
        ? `<p class="nota" style="text-align:right">Pagado con ${esc(p.metodoPago)}</p>`
        : `<h2 style="margin-top:20px">Registrar pago</h2><div class="campos"><select id="metodo" aria-label="Método de pago">${metodos.map(m => `<option value="${m.id}">${esc(m.nombre)}</option>`).join('')}</select><button id="pagar">Registrar pago</button></div>`) : '')
    + '<button id="verHistorial" class="claro" style="width:100%;margin-top:12px">Ver historial de estados</button><div id="historial"></div>'
    + (edita ? `<h2 style="margin-top:20px">Menú</h2>${items}` : '');
}

$('#mesas').addEventListener('click', async e => {
  const b = e.target.closest('.mesa'); if (!b) return;
  try { menu = await api('/menu'); mostrar(await api('/pedidos', 'POST', {mesaId: +b.dataset.id, tipoPedido: 'EN_SITIO'})); aviso('Pedido creado'); cargarMesas(); }
  catch (err) { aviso(err.message, true); }
});
$('#activos').addEventListener('click', async e => {
  const b = e.target.closest('[data-ver]'); if (!b) return;
  try { mostrar(await api('/pedidos/' + b.dataset.ver)); } catch (err) { aviso(err.message, true); }
});
// ---------- Asistente de pedidos con IA ----------
function pintarPropuesta() {
  const p = propuesta;
  if (!p) { $('#iaPropuesta').innerHTML = ''; return; }
  const lineas = p.items.map(i => `<div class="linea"><div>${i.cantidad} × ${esc(i.productoNombre)}${i.notas ? `<div class="nota">${esc(i.notas)}</div>` : ''}</div></div>`).join('') || '<p class="vacio">No se reconoció ningún producto.</p>';
  const avisos = p.advertencias.map(a => `<div class="nota" style="color:var(--cancelado)">⚠ ${esc(a)}</div>`).join('');
  $('#iaPropuesta').innerHTML = `<div class="ticket" style="--c:var(--preparacion);margin-top:10px"><div class="cab"><strong>${p.tipoPedido === 'PARA_LLEVAR' ? 'Para llevar' : 'Mesa ' + (p.mesaNumero ?? '?')}</strong><span class="nota">${esc(p.motor)} · ${p.milisegundos} ms</span></div>${lineas}${avisos}
<div class="campos" style="margin-top:10px"><button id="iaCrear" ${p.items.length ? '' : 'disabled'}>Crear pedido</button><button class="claro" id="iaDescartar">Descartar</button></div></div>`;
}
$('#iaInterpretar').onclick = async () => {
  const texto = $('#iaTexto').value.trim(); if (!texto) return;
  const b = $('#iaInterpretar'); b.disabled = true; b.textContent = 'Interpretando…';
  try { propuesta = await api('/ia/interpretar', 'POST', {texto, motor: $('#iaMotor').value || null}); pintarPropuesta(); }
  catch (err) { aviso(err.message, true); }
  finally { b.disabled = false; b.textContent = 'Interpretar'; }
};
$('#iaPropuesta').addEventListener('click', async e => {
  if (e.target.id === 'iaDescartar') { propuesta = null; pintarPropuesta(); return; }
  if (e.target.id !== 'iaCrear') return;
  try {
    const p = propuesta;
    mostrar(await api('/ia/pedidos/confirmar', 'POST', {tipoPedido: p.tipoPedido, mesaNumero: p.mesaNumero,
      items: p.items.map(i => ({productoId: i.productoId, cantidad: i.cantidad, notas: i.notas}))}));
    aviso('Pedido creado desde el texto'); propuesta = null; pintarPropuesta(); $('#iaTexto').value = ''; cargarMesas();
  } catch (err) { aviso(err.message, true); }
});

$('#llevar').onclick = async () => {
  try { menu = await api('/menu'); mostrar(await api('/pedidos', 'POST', {tipoPedido: 'PARA_LLEVAR'})); aviso('Pedido para llevar creado'); cargarActivos(); }
  catch (err) { aviso(err.message, true); }
};
$('#panel').addEventListener('click', async e => {
  const t = e.target;
  try {
    if (t.dataset.agregar) {
      const c = t.parentElement;
      mostrar(await api(`/pedidos/${pedido.id}/detalles`, 'POST', {productoId: +t.dataset.agregar, cantidad: +c.children[0].value || 1, notas: c.children[1].value.trim() || null}));
    } else if (t.dataset.quitar) {
      mostrar(await api(`/pedidos/${pedido.id}/detalles/${t.dataset.quitar}`, 'DELETE'));
    } else if (t.id === 'verHistorial') {
      const hist = await api(`/pedidos/${pedido.id}/historial`);
      $('#historial').innerHTML = hist.map(h => `<div class="linea"><div><span class="chip e-${h.estado}">${ETIQ[h.estado]}</span> <span class="nota">por ${esc(h.actorNombre || '—')} (${(h.actorTipo || '').toLowerCase()})</span></div><div class="nota">${new Date(h.fecha).toLocaleString('es-CO')}</div></div>`).join('');
    } else if (t.id === 'cancelar') {
      const motivo = prompt(`¿Cancelar el pedido n.º ${pedido.id}? Puedes escribir el motivo (opcional).`, '');
      if (motivo === null) return;
      mostrar(await api(`/pedidos/${pedido.id}/cancelar`, 'PUT', {motivo: motivo.trim() || null})); aviso('Pedido cancelado'); cargarMesas();
    } else if (t.id === 'pagar') {
      mostrar(await api(`/pedidos/${pedido.id}/pago`, 'PUT', {metodoPagoId: +$('#metodo').value})); aviso('Pago registrado');
    } else if (t.id === 'entregar') {
      mostrar(await api(`/pedidos/${pedido.id}/entregar`, 'PUT')); aviso('Pedido entregado'); cargarMesas();
    }
  } catch (err) { aviso(err.message, true); }
});
$('#abrir').onclick = async () => {
  try { mostrar(await api('/pedidos/' + $('#nroPedido').value)); } catch (err) { aviso(err.message, true); }
};
// Si cocina cambia el estado, se refleja solo (cada 5 s)
setInterval(async () => {
  cargarActivos().catch(() => {});
  if (!pedido) return;
  try { const p = await api('/pedidos/' + pedido.id); if (p.estado !== pedido.estado) { mostrar(p); cargarMesas(); } } catch (e) {}
}, 5000);

(async () => {
  try {
    await cargarMesas(); menu = await api('/menu'); metodos = await api('/metodos-pago');
    const ia = await api('/ia/estado').catch(() => null);
    if (ia && !ia.motores.GEMINI) { const o = $('#iaMotor option[value="GEMINI"]'); o.disabled = true; o.textContent = 'Gemini (falta la clave)'; }
    const id = localStorage.getItem('pedido');
    if (id) { try { mostrar(await api('/pedidos/' + id)); } catch (e) {} }
  } catch (err) { aviso('No se pudo conectar con el servidor', true); }
})();
</script></body></html>
